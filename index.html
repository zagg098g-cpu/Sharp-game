<!DOCTYPE html>
<html lang="bn">
<head>
<script src="https://pl31214545.profitableratecpmnetwork.com/36/65/78/366578e1e494adc63ad8464efef3aea9.js"></script>
<script src="https://pl31214544.profitableratecpmnetwork.com/bc/f4/b8/bcf4b8807d0b59c65f1abf8ddd9bcf01.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Snake Coin Adventure</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

body{
  background:#06110b;
  font-family:Arial,sans-serif;
  color:white;
  overflow:hidden;
}

#app{
  width:100vw;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;

  background:
  radial-gradient(
    circle at top,
    #17472b,
    #06110b 72%
  );
}


/* =========================
   HEADER
========================= */

#header{
  width:94%;
  max-width:500px;

  margin-top:12px;

  display:flex;
  justify-content:space-between;

  gap:7px;
}

.stat{
  flex:1;

  padding:9px 5px;

  text-align:center;

  background:rgba(255,255,255,.08);

  border:1px solid
  rgba(255,255,255,.13);

  border-radius:14px;

  box-shadow:
  0 5px 20px rgba(0,0,0,.25);
}

.stat small{
  display:block;

  color:#a8cbb3;

  font-size:10px;

  margin-bottom:4px;
}

.stat strong{
  font-size:17px;
}


/* =========================
   BOARD
========================= */

#board{

  position:relative;

  width:min(94vw,500px);

  aspect-ratio:1/1;

  margin-top:12px;

  background:
  linear-gradient(
    45deg,
    rgba(255,255,255,.025) 25%,
    transparent 25%,
    transparent 75%,
    rgba(255,255,255,.025) 75%
  ),
  linear-gradient(
    45deg,
    rgba(255,255,255,.025) 25%,
    transparent 25%,
    transparent 75%,
    rgba(255,255,255,.025) 75%
  ),
  #0d2518;

  background-size:40px 40px;

  background-position:
  0 0,
  20px 20px;

  border:
  3px solid #285a3b;

  border-radius:18px;

  box-shadow:
  0 0 30px
  rgba(0,255,120,.12),

  inset 0 0 30px
  rgba(0,0,0,.4);

  overflow:hidden;
}


/* =========================
   SNAKE
========================= */

.snake{

  position:absolute;

  width:20px;
  height:20px;

  border-radius:6px;

  background:
  linear-gradient(
    135deg,
    #63ff86,
    #0db93d
  );

  box-shadow:
  0 0 8px
  rgba(50,255,100,.5);

  transition:
  background .2s;
}

.snake.head{

  background:
  linear-gradient(
    135deg,
    #b2ffbc,
    #17dc4e
  );

  border-radius:8px;

  box-shadow:
  0 0 12px
  rgba(80,255,110,.7);
}

.eye{

  position:absolute;

  width:4px;
  height:4px;

  background:#06110b;

  border-radius:50%;

  top:4px;
}

.eye.one{
  left:4px;
}

.eye.two{
  right:4px;
}


/* =========================
   COIN
========================= */

.coin{

  position:absolute;

  width:22px;
  height:22px;

  border-radius:50%;

  background:
  radial-gradient(
    circle at 35% 30%,
    #fff7a0,
    #ffd21c 35%,
    #e99c00 75%
  );

  border:
  2px solid #fff0a0;

  box-shadow:
  0 0 12px
  rgba(255,205,20,.7);

  animation:
  coinPulse .55s infinite alternate;
}

.coin::after{

  content:"$";

  position:absolute;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  color:#9b6500;

  font-weight:bold;

  font-size:13px;
}

@keyframes coinPulse{

  from{
    transform:scale(.9);
  }

  to{
    transform:scale(1.08);
  }

}


/* =========================
   CONTROLS
========================= */

#controls{

  width:min(94vw,420px);

  margin-top:14px;

  display:grid;

  grid-template-columns:
  80px 80px 80px;

  grid-template-rows:
  70px 70px;

  justify-content:center;

  gap:8px;
}

.btn{

  border:0;

  border-radius:18px;

  background:
  linear-gradient(
    145deg,
    #183c27,
    #0d2417
  );

  border:
  1px solid #2f6742;

  color:white;

  font-size:28px;

  font-weight:bold;

  box-shadow:
  0 5px 15px
  rgba(0,0,0,.35);
}

.btn:active{

  transform:scale(.92);

  background:#23633a;
}

#up{
  grid-column:2;
  grid-row:1;
}

#left{
  grid-column:1;
  grid-row:2;
}

#down{
  grid-column:2;
  grid-row:2;
}

#right{
  grid-column:3;
  grid-row:2;
}


/* =========================
   LEVEL MESSAGE
========================= */

#levelMessage{

  position:absolute;

  top:50%;
  left:50%;

  transform:
  translate(-50%,-50%)
  scale(.7);

  opacity:0;

  padding:
  15px 25px;

  background:
  rgba(0,0,0,.78);

  border:
  1px solid #4dff79;

  border-radius:18px;

  color:#6dff8c;

  font-size:25px;

  font-weight:bold;

  pointer-events:none;

  z-index:50;
}

#levelMessage.show{

  animation:
  levelUp 1.1s forwards;
}

@keyframes levelUp{

  0%{
    opacity:0;

    transform:
    translate(-50%,-50%)
    scale(.7);
  }

  25%{
    opacity:1;

    transform:
    translate(-50%,-50%)
    scale(1.12);
  }

  70%{
    opacity:1;

    transform:
    translate(-50%,-50%)
    scale(1);
  }

  100%{
    opacity:0;

    transform:
    translate(-50%,-50%)
    scale(1.2);
  }
}


/* =========================
   OVERLAY
========================= */

#overlay{

  position:fixed;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
  rgba(0,0,0,.74);

  z-index:100;
}

.panel{

  width:88%;

  max-width:390px;

  padding:28px;

  text-align:center;

  border-radius:25px;

  background:
  linear-gradient(
    145deg,
    #142d1e,
    #09150e
  );

  border:
  1px solid #376e49;

  box-shadow:
  0 20px 60px
  rgba(0,0,0,.55);
}

.panel h1{

  font-size:30px;

  margin-bottom:12px;
}

.panel p{

  color:#b9d1c0;

  line-height:1.7;

  margin-bottom:20px;
}

#startBtn{

  border:0;

  padding:
  14px 30px;

  border-radius:30px;

  background:
  linear-gradient(
    135deg,
    #24d95a,
    #0a9c38
  );

  color:white;

  font-size:17px;

  font-weight:bold;

  box-shadow:
  0 7px 20px
  rgba(0,180,70,.25);
}


/* =========================
   LEVEL 6
========================= */

.level6{

  animation:
  level6Glow .7s infinite alternate;
}

@keyframes level6Glow{

  from{
    box-shadow:
    0 0 10px
    rgba(255,70,20,.3);
  }

  to{
    box-shadow:
    0 0 25px
    rgba(255,70,20,.8);
  }

}


/* MOBILE */

@media(max-height:650px){

  #board{
    width:min(82vw,400px);
  }

  #controls{
    margin-top:7px;

    transform:scale(.85);
  }

}

</style>
</head>


<body>

<div id="app">


  <!-- HEADER -->

  <div id="header">

    <div class="stat">
      <small>🪙 COINS</small>
      <strong id="coins">0</strong>
    </div>

    <div class="stat">
      <small>🏆 SCORE</small>
      <strong id="score">0</strong>
    </div>

    <div class="stat">
      <small>📈 LEVEL</small>
      <strong id="level">1/6</strong>
    </div>

    <div class="stat">
      <small>🥇 BEST</small>
      <strong id="best">0</strong>
    </div>

  </div>


  <!-- BOARD -->

  <div id="board">

    <div
      id="coin"
      class="coin">
    </div>

    <div
      id="levelMessage">
      LEVEL 1
    </div>

  </div>


  <!-- CONTROLS -->

  <div id="controls">

    <button
      class="btn"
      id="up">
      ▲
    </button>

    <button
      class="btn"
      id="left">
      ◀
    </button>

    <button
      class="btn"
      id="down">
      ▼
    </button>

    <button
      class="btn"
      id="right">
      ▶
    </button>

  </div>

</div>


<!-- OVERLAY -->

<div id="overlay">

  <div class="panel">

    <h1 id="title">
      🐍 Snake Coin
    </h1>

    <p id="message">

      🪙 কয়েন সংগ্রহ করে
      সাপকে বড় করো।<br><br>

      📈 মোট ৬টি Level থাকবে।<br>

      প্রতি ৫টি কয়েনে Level বাড়বে।

    </p>

    <button id="startBtn">
      START GAME
    </button>

  </div>

</div>


<script>

/* =========================
   ELEMENTS
========================= */

const board =
document.getElementById("board");

const coin =
document.getElementById("coin");

const scoreEl =
document.getElementById("score");

const coinsEl =
document.getElementById("coins");

const levelEl =
document.getElementById("level");

const bestEl =
document.getElementById("best");

const overlay =
document.getElementById("overlay");

const title =
document.getElementById("title");

const message =
document.getElementById("message");

const startBtn =
document.getElementById("startBtn");

const levelMessage =
document.getElementById(
  "levelMessage"
);


/* =========================
   SETTINGS
========================= */

const GRID = 20;


/*
   মোট ৬টি Level

   Level 1 = 190ms
   Level 2 = 155ms
   Level 3 = 125ms
   Level 4 = 100ms
   Level 5 = 78ms
   Level 6 = 60ms

   কম সময় = বেশি দ্রুত
*/

const LEVEL_SPEEDS = [
  190,
  155,
  125,
  100,
  78,
  60
];


/*
   প্রতি Level-এ ৫টি Coin
*/

const COINS_PER_LEVEL = 5;


let cellSize;


let snake = [];


let coinPos = {
  x:10,
  y:10
};


let direction = {
  x:1,
  y:0
};


let nextDirection = {
  x:1,
  y:0
};


let running = false;


let timer = null;


let score = 0;


let coins = 0;


let level = 1;


let speed =
LEVEL_SPEEDS[0];


let best =
Number(
  localStorage.getItem(
    "snakeBest"
  )
) || 0;


bestEl.textContent =
best;


/* =========================
   START
========================= */

function startGame(){

  stopGame();


  snake = [

    {x:10,y:10},

    {x:9,y:10},

    {x:8,y:10}

  ];


  direction = {
    x:1,
    y:0
  };


  nextDirection = {
    x:1,
    y:0
  };


  score = 0;

  coins = 0;

  level = 1;


  speed =
  LEVEL_SPEEDS[0];


  updateStats();


  running = true;


  overlay.style.display =
  "none";


  levelMessage.classList.remove(
    "show"
  );


  resizeBoard();


  placeCoin();


  draw();


  startTimer();

}


/* =========================
   TIMER
========================= */

function startTimer(){

  clearInterval(timer);


  timer =
  setInterval(
    gameStep,
    speed
  );

}


/* =========================
   STOP
========================= */

function stopGame(){

  clearInterval(timer);

  timer = null;

  running = false;

}


/* =========================
   RESIZE
========================= */

function resizeBoard(){

  cellSize =
  board.clientWidth / GRID;

}


/* =========================
   DRAW
========================= */

function draw(){

  board
  .querySelectorAll(".snake")
  .forEach(
    el => el.remove()
  );


  snake.forEach(
    (part,index) => {

      const el =
      document.createElement(
        "div"
      );


      el.className =
      "snake" +
      (
        index === 0
        ? " head"
        : ""
      );


      el.style.left =
      (
        part.x *
        cellSize
      ) + "px";


      el.style.top =
      (
        part.y *
        cellSize
      ) + "px";


      el.style.width =
      (
        cellSize - 2
      ) + "px";


      el.style.height =
      (
        cellSize - 2
      ) + "px";


      if(index === 0){

        const eye1 =
        document.createElement(
          "span"
        );

        eye1.className =
        "eye one";


        const eye2 =
        document.createElement(
          "span"
        );

        eye2.className =
        "eye two";


        el.appendChild(
          eye1
        );

        el.appendChild(
          eye2
        );

      }


      board.appendChild(el);

    }
  );


  coin.style.left =
  (
    coinPos.x *
    cellSize +
    (cellSize - 22) / 2
  ) + "px";


  coin.style.top =
  (
    coinPos.y *
    cellSize +
    (cellSize - 22) / 2
  ) + "px";

}


/* =========================
   GAME STEP
========================= */

function gameStep(){

  if(!running)
    return;


  direction = {
    x:nextDirection.x,
    y:nextDirection.y
  };


  const head = {

    x:
    snake[0].x +
    direction.x,

    y:
    snake[0].y +
    direction.y

  };


  /*
    WALL
  */

  if(

    head.x < 0 ||

    head.x >= GRID ||

    head.y < 0 ||

    head.y >= GRID

  ){

    gameOver();

    return;

  }


  /*
    BODY
  */

  for(
    let i=0;
    i<snake.length;
    i++
  ){

    if(

      head.x === snake[i].x &&

      head.y === snake[i].y

    ){

      gameOver();

      return;

    }

  }


  /*
    ADD HEAD
  */

  snake.unshift(head);


  /*
    COIN
  */

  if(

    head.x === coinPos.x &&

    head.y === coinPos.y

  ){

    collectCoin();

  }

  else{

    snake.pop();

  }


  draw();

}


/* =========================
   COLLECT COIN
========================= */

function collectCoin(){

  coins++;

  score += 10;


  placeCoin();


  /*
    নতুন Level
  */

  const calculatedLevel =
  Math.floor(
    coins /
    COINS_PER_LEVEL
  ) + 1;


  /*
    সর্বোচ্চ Level = 6
  */

  const newLevel =
  Math.min(
    6,
    calculatedLevel
  );


  /*
    Level change
  */

  if(
    newLevel !== level
  ){

    level =
    newLevel;


    speed =
    LEVEL_SPEEDS[
      level - 1
    ];


    /*
      Level 6 হলে
      বিশেষ effect
    */

    if(level === 6){

      board.classList.add(
        "level6"
      );

    }


    restartTimer();


    showLevelUp();

  }


  updateStats();

}


/* =========================
   LEVEL UP
========================= */

function showLevelUp(){

  levelMessage.textContent =
  "🚀 LEVEL " +
  level;


  levelMessage.classList.remove(
    "show"
  );


  void levelMessage.offsetWidth;


  levelMessage.classList.add(
    "show"
  );

}


/* =========================
   RESTART TIMER
========================= */

function restartTimer(){

  clearInterval(timer);


  timer =
  setInterval(
    gameStep,
    speed
  );

}


/* =========================
   PLACE COIN
========================= */

function placeCoin(){

  let valid = false;


  while(!valid){

    coinPos = {

      x:
      Math.floor(
        Math.random() *
        GRID
      ),

      y:
      Math.floor(
        Math.random() *
        GRID
      )

    };


    valid = true;


    for(
      const part of snake
    ){

      if(

        part.x === coinPos.x &&

        part.y === coinPos.y

      ){

        valid = false;

        break;

      }

    }

  }

}


/* =========================
   STATS
========================= */

function updateStats(){

  scoreEl.textContent =
  score;

  coinsEl.textContent =
  coins;

  levelEl.textContent =
  level + "/6";


  if(score > best){

    best = score;

    bestEl.textContent =
    best;


    localStorage.setItem(
      "snakeBest",
      best
    );

  }

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

  stopGame();


  board.classList.remove(
    "level6"
  );


  updateStats();


  title.textContent =
  "💥 GAME OVER";


  message.innerHTML =

  "🐍 সাপটি ধাক্কা খেয়েছে!<br><br>" +

  "🪙 Coins: <b>" +
  coins +
  "</b><br>" +

  "🏆 Score: <b>" +
  score +
  "</b><br>" +

  "📈 Level: <b>" +
  level +
  "/6</b>";


  startBtn.textContent =
  "RESTART GAME";


  overlay.style.display =
  "flex";

}


/* =========================
   DIRECTION
========================= */

function setDirection(x,y){

  if(!running)
    return;


  /*
    বিপরীত দিকে
    সরাসরি ঘুরতে পারবে না
  */

  if(

    direction.x === -x &&

    direction.y === -y

  ){

    return;

  }


  nextDirection = {
    x:x,
    y:y
  };

}


/* =========================
   MOBILE BUTTONS
========================= */

document
.getElementById("up")
.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    setDirection(0,-1);

  }
);


document
.getElementById("down")
.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    setDirection(0,1);

  }
);


document
.getElementById("left")
.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    setDirection(-1,0);

  }
);


document
.getElementById("right")
.addEventListener(
  "pointerdown",
  function(e){

    e.preventDefault();

    setDirection(1,0);

  }
);


/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  function(e){

    const key =
    e.key.toLowerCase();


    if(

      e.key === "ArrowUp" ||
      key === "w"

    ){

      setDirection(0,-1);

    }


    if(

      e.key === "ArrowDown" ||
      key === "s"

    ){

      setDirection(0,1);

    }


    if(

      e.key === "ArrowLeft" ||
      key === "a"

    ){

      setDirection(-1,0);

    }


    if(

      e.key === "ArrowRight" ||
      key === "d"

    ){

      setDirection(1,0);

    }

  }
);


/* =========================
   START BUTTON
========================= */

startBtn.addEventListener(
  "click",
  startGame
);


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  function(){

    resizeBoard();

    if(running){

      draw();

    }

  }
);


/* =========================
   INITIAL
========================= */

resizeBoard();

</script>

</body>
</html>
